spring:
  application:
    name: xeno-crm-backend

  datasource:
    url: jdbc:postgresql://db.fkuqrsthtqcymejapuqy.supabase.co:5432/postgres?sslmode=require&prepareThreshold=0
    username: postgres.fkuqrsthtqcymejapuqy
    password: Likhith@123
    driver-class-name: org.postgresql.Driver
    hikari:
      maximum-pool-size: 10
      minimum-idle: 2
      connection-timeout: 30000
      idle-timeout: 600000
      max-lifetime: 1800000
      connection-test-query: SELECT 1

  jpa:
    hibernate:
      ddl-auto: none
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
        jdbc.batch_size: 50
        order_inserts: true
        order_updates: true
        temp.use_jdbc_metadata_defaults: false

  flyway:
    enabled: true
    locations: classpath:db/migration
    baseline-on-migrate: true

  config:
    import: optional:classpath:application-local.properties

server:
  port: 8080

# Gemini LLM
gemini:
  api-key: AQ.YOUR_API_KEY_HERE
  model: gemini-2.5-flash
  endpoint: https://generativelanguage.googleapis.com/v1beta/models
  max-output-tokens: 2000
  temperature: 0.3

# Channel stub
channel:
  stub:
    base-url: http://localhost:5001/api/v1/stub/send
  crm:
    callback-url: http://localhost:8080/api/v1/callbacks/channel

# Security
security:
  api-key: likhit@178926a

# Async thread pool
async:
  core-pool-size: 10
  max-pool-size: 50
  queue-capacity: 500

# Self-correction thresholds
correction:
  failure-rate-threshold: 0.30
  low-open-rate-threshold: 0.05
  opt-out-rate-threshold: 0.02
  evaluation-window-minutes: 10

logging:
  level:
    com.xenocrm: DEBUG
